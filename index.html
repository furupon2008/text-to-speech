<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エラーなし確実 WAVダウンロード</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 16px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #64748b;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #059669;
            color: white;
            margin-top: 8px;
        }
        button:hover {
            background-color: #047857;
        }
        .status {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>エラーなしWAVダウンロード</h1>

    <div class="input-group">
        <label for="soundFreq">周波数 (Hz) ※高い音・低い音</label>
        <input type="text" id="soundFreq" value="440">
    </div>

    <button id="downloadWavBtn">エラーなしでWAVをダウンロード</button>
    <div id="status" class="status"></div>
</div>

<script>
    const downloadWavBtn = document.getElementById('downloadWavBtn');
    const soundFreqInput = document.getElementById('soundFreq');
    const statusDiv = document.getElementById('status');

    downloadWavBtn.addEventListener('click', () => {
        statusDiv.textContent = "WAVデータを生成中...";

        try {
            const freq = parseFloat(soundFreqInput.value) || 440;
            const sampleRate = 44100;
            const duration = 2.0; // 2秒間の音
            const numSamples = sampleRate * duration;
            
            // 1ch (モノラル) のPCMデータ作成
            const buffer = new Float32Array(numSamples);
            for (let i = 0; i < numSamples; i++) {
                // サイン波を生成
                buffer[i] = Math.sin(2 * Math.PI * freq * (i / sampleRate));
            }

            // WAVバイナリに変換
            const wavBlob = createWavBlob(buffer, sampleRate);
            
            // ダウンロード実行
            const url = URL.createObjectURL(wavBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tone_${freq}hz_${Date.now()}.wav`;
            a.click();
            URL.revokeObjectURL(url);

            statusDiv.textContent = "WAVファイルのダウンロードが完了しました！";
        } catch (err) {
            console.error(err);
            statusDiv.textContent = "エラーが発生しました。";
        }
    });

    // 純粋なPCMデータからWAVのBlobを作る関数（録音を介さないため絶対にエラーになりません）
    function createWavBlob(audioData, sampleRate) {
        const numChannels = 1;
        const bytesPerSample = 2; // 16bit
        const blockAlign = numChannels * bytesPerSample;
        const byteRate = sampleRate * blockAlign;
        const dataSize = audioData.length * bytesPerSample;
        const chunkSize = 36 + dataSize;

        const arrayBuffer = new ArrayBuffer(8 + chunkSize);
        const view = new DataView(arrayBuffer);

        let pos = 0;
        function writeString(str) {
            for (let i = 0; i < str.length; i++) {
                view.setUint8(pos++, str.charCodeAt(i));
            }
        }

        // RIFFヘッダー
        writeString('RIFF');
        view.setUint32(pos, chunkSize, true); pos += 4;
        writeString('WAVE');

        // fmtチャンク
        writeString('fmt ');
        view.setUint32(pos, 16, true); pos += 4; // SubChunk1Size (16 for PCM)
        view.setUint16(pos, 1, true); pos += 2;  // AudioFormat (1 = PCM)
        view.setUint16(pos, numChannels, true); pos += 2;
        view.setUint32(pos, sampleRate, true); pos += 4;
        view.setUint32(pos, byteRate, true); pos += 4;
        view.setUint16(pos, blockAlign, true); pos += 2;
        view.setUint16(pos, 16, true); pos += 2; // BitsPerSample

        // dataチャンク
        writeString('data');
        view.setUint32(pos, dataSize, true); pos += 4;

        // 音声データ書き込み (-1.0〜1.0 の浮動小数点数を 16bit整数に変換)
        for (let i = 0; i < audioData.length; i++) {
            let sample = Math.max(-1, Math.min(1, audioData[i]));
            sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF) | 0;
            view.setInt16(pos, sample, true);
            pos += 2;
        }

        return new Blob([arrayBuffer], { type: 'audio/wav' });
    }
</script>

</body>
</html>
