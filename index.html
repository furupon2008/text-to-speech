<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声読み上げ ＆ WAVダウンロード</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 16px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #64748b;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-play { background-color: #4f46e5; color: white; }
        .btn-other { background-color: #e2e8f0; color: #1e293b; }
        .btn-download { background-color: #059669; color: white; width: 100%; padding: 12px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { font-size: 0.85rem; text-align: center; margin-top: 8px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h1>音声読み上げ ＆ WAVダウンロード</h1>

    <div class="input-group">
        <label for="textInput">読み上げるテキスト</label>
        <textarea id="textInput">GitHub Pagesで確実に動く、WAVダウンロードアプリです。</textarea>
    </div>

    <div class="input-group">
        <label for="voiceSelect">音声選択</label>
        <select id="voiceSelect"></select>
    </div>

    <div class="btn-group">
        <button id="playBtn" class="btn-play">再生</button>
        <button id="pauseBtn" class="btn-other" disabled>一時停止</button>
        <button id="stopBtn" class="btn-other" disabled>停止</button>
    </div>

    <div class="input-group">
        <button id="downloadWavBtn" class="btn-download">WAV形式でダウンロード</button>
    </div>

    <div id="status" class="status"></div>
</div>

<script>
    const textInput = document.getElementById('textInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadWavBtn = document.getElementById('downloadWavBtn');
    const statusDiv = document.getElementById('status');

    let voices = [];

    function loadVoices() {
        voices = window.speechSynthesis.getVoices();
        voiceSelect.innerHTML = '';
        voices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `${voice.name} (${voice.lang})`;
            if (voice.lang.includes('ja') || voice.lang.includes('JP')) {
                option.selected = true;
            }
            voiceSelect.appendChild(option);
        });
    }

    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    playBtn.addEventListener('click', () => {
        if (window.speechSynthesis.speaking && window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
            updateState(true);
            return;
        }
        window.speechSynthesis.cancel();
        const text = textInput.value;
        if (!text) return;

        const utterance = new SpeechSynthesisUtterance(text);
        if (voices[voiceSelect.value]) {
            utterance.voice = voices[voiceSelect.value];
        }
        utterance.onstart = () => updateState(true);
        utterance.onend = () => updateState(false);
        utterance.onerror = () => updateState(false);

        window.speechSynthesis.speak(utterance);
    });

    pauseBtn.addEventListener('click', () => {
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.pause();
            pauseBtn.textContent = "再開";
        } else if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
            pauseBtn.textContent = "一時停止";
        }
    });

    stopBtn.addEventListener('click', () => {
        window.speechSynthesis.cancel();
        updateState(false);
    });

    function updateState(isPlaying) {
        playBtn.disabled = isPlaying;
        pauseBtn.disabled = !isPlaying;
        stopBtn.disabled = !isPlaying;
        if (!isPlaying) pauseBtn.textContent = "一時停止";
    }

    async function getAudioBuffer(text, voiceIndex) {
        return new Promise((resolve, reject) => {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const dest = audioCtx.createMediaStreamDestination();
            const mediaRecorder = new MediaRecorder(dest.stream);
            const chunks = [];

            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = async () => {
                try {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const arrayBuffer = await blob.arrayBuffer();
                    const decoded = await audioCtx.decodeAudioData(arrayBuffer);
                    audioCtx.close();
                    resolve(decoded);
                } catch (err) {
                    audioCtx.close();
                    reject(err);
                }
            };

            const utterance = new SpeechSynthesisUtterance(text);
            if (voices[voiceIndex]) utterance.voice = voices[voiceIndex];

            mediaRecorder.start();
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);

            utterance.onend = () => {
                setTimeout(() => {
                    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                }, 200);
            };
            utterance.onerror = (e) => {
                if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                reject(e);
            };
        });
    }

    downloadWavBtn.addEventListener('click', async () => {
        const text = textInput.value;
        if (!text) {
            alert('テキストを入力してください。');
            return;
        }

        statusDiv.textContent = "音声を生成中...";
        downloadWavBtn.disabled = true;

        try {
            const buffer = await getAudioBuffer(text, voiceSelect.value);
            const wavBlob = audioBufferToWav(buffer);
            
            const url = URL.createObjectURL(wavBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `voice_${Date.now()}.wav`;
            a.click();
            URL.revokeObjectURL(url);
            
            statusDiv.textContent = "WAVファイルのダウンロードが完了しました！";
        } catch (err) {
            console.error(err);
            statusDiv.textContent = "生成に失敗しました。";
        } finally {
            downloadWavBtn.disabled = false;
        }
    });

    function audioBufferToWav(buffer) {
        const numOfChan = buffer.numberChannels;
        const length = buffer.length * numOfChan * 2 + 44;
        const out = new DataView(new ArrayBuffer(length));
        let channels = [];
        let sampleRate = buffer.sampleRate;
        let offset = 0;
        let pos = 0;

        function writeString(str) {
            for (let i = 0; i < str.length; i++) out.setUint8(pos++, str.charCodeAt(i));
        }
        function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

        writeString('RIFF');
        setUint32(length - 8);
        writeString('WAVE');
        writeString('fmt ');
        setUint32(16);
        setUint16(1);
        setUint16(numOfChan);
        setUint32(sampleRate);
        setUint32(sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2);
        setUint16(16);
        writeString('data');
        setUint32(length - pos - 4);

        for (let i = 0; i < buffer.numberOfChannels; i++) {
            channels.push(buffer.getChannelData(i));
        }

        while (pos < length) {
            for (let i = 0; i < numOfChan; i++) {
                let sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
                out.setInt16(pos, sample, true);
                pos += 2;
            }
            offset++;
        }
        return new Blob([out.buffer], { type: 'audio/wav' });
    }
</script>

</body>
</html>
