<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テキスト読み上げ＆音声ダウンロード（Gemini TTS）</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 30px auto; padding: 20px; line-height: 1.6; }
  label { display: block; font-weight: bold; margin: 14px 0 4px; }
  textarea, input, select { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; }
  textarea { height: 140px; }
  button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 10px 8px 0 0; }
  #status { margin-top: 14px; min-height: 1.5em; }
  .err { color: #c00; }
  .note { font-size: 13px; color: #666; }
  audio { width: 100%; margin-top: 14px; }
  #dl { display: none; }
</style>
</head>
<body>
<h2>テキスト読み上げ＆ダウンロード</h2>
<p class="note">Gemini の音声合成APIで音声を作り、WAV / MP3 で保存します。APIキーはこのブラウザ内（localStorage）にだけ保存され、Google以外には送信されません。</p>

<label for="apiKey">Gemini APIキー</label>
<input id="apiKey" type="password" placeholder="Google AI Studio で取得したキー">
<p class="note">キーをお持ちでない方は、<a href="https://aistudio.google.com/api-keys" target="_blank" rel="noopener noreferrer">こちらから取得できます</a>（無料のGoogleアカウントで利用できます）。</p>
  
<input id="apiKey" type="password" placeholder="Google AI Studio で取得したキー">

<label for="textInput">読み上げるテキスト</label>
<textarea id="textInput">こんにちは！テキストを音声に変換して、ダウンロードできるページです。</textarea>

<label for="style">話し方の指示（任意）</label>
<input id="style" placeholder="例：明るく元気に / 落ち着いてゆっくり">

<label for="voice">声</label>
<select id="voice">
  <option value="Kore">Kore（しっかり）</option>
  <option value="Puck">Puck（アップビート）</option>
  <option value="Zephyr">Zephyr（明るい）</option>
  <option value="Charon">Charon（落ち着き）</option>
  <option value="Aoede">Aoede（軽やか）</option>
  <option value="Leda">Leda（若々しい）</option>
  <option value="Fenrir">Fenrir（力強い）</option>
  <option value="Orus">Orus（しっかり）</option>
  <option value="Callirrhoe">Callirrhoe（おおらか）</option>
  <option value="Sulafat">Sulafat（温かい）</option>
</select>

<label for="model">モデル名</label>
<input id="model" value="gemini-2.5-flash-preview-tts">

<label for="format">保存形式</label>
<select id="format">
  <option value="wav">WAV</option>
  <option value="mp3">MP3</option>
</select>

<button id="go" onclick="generate()">音声を生成</button>
<button id="dl" onclick="download()">ダウンロード</button>

<div id="status"></div>
<audio id="player" controls style="display:none"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
const SAMPLE_RATE = 24000; // Gemini TTS は 24kHz / 16bit / モノラルのPCM
let pcm = null;            // Int16Array
let blobUrl = null, fileName = '';

const $ = id => document.getElementById(id);
try { $('apiKey').value = localStorage.getItem('gemini_key') || ''; } catch (e) {}

function setStatus(msg, isErr) {
  $('status').textContent = msg;
  $('status').className = isErr ? 'err' : '';
}

function b64ToInt16(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Int16Array(bytes.buffer, 0, Math.floor(bytes.length / 2));
}

function toWav(samples) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true);
  w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, SAMPLE_RATE, true); v.setUint32(28, SAMPLE_RATE * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, samples.length * 2, true);
  new Int16Array(buf, 44).set(samples);
  return new Blob([buf], { type: 'audio/wav' });
}

function toMp3(samples) {
  if (typeof lamejs === 'undefined') throw new Error('MP3エンコーダ(lamejs)を読み込めませんでした。ネット接続を確認するか、WAVを選んでください。');
  const enc = new lamejs.Mp3Encoder(1, SAMPLE_RATE, 128);
  const parts = [];
  for (let i = 0; i < samples.length; i += 1152) {
    const out = enc.encodeBuffer(samples.subarray(i, i + 1152));
    if (out.length) parts.push(new Uint8Array(out));
  }
  const end = enc.flush();
  if (end.length) parts.push(new Uint8Array(end));
  return new Blob(parts, { type: 'audio/mpeg' });
}

async function generate() {
  const key = $('apiKey').value.trim();
  const text = $('textInput').value.trim();
  if (!key) return setStatus('APIキーを入力してください。', true);
  if (!text) return setStatus('テキストを入力してください。', true);
  try { localStorage.setItem('gemini_key', key); } catch (e) {}

  const style = $('style').value.trim();
  const prompt = style ? `${style}：${text}` : text;

  $('go').disabled = true;
  $('dl').style.display = 'none';
  setStatus('音声を生成中…（数秒〜数十秒かかります）');

  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent($('model').value.trim())}:generateContent`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          responseModalities: ['AUDIO'],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: $('voice').value } } }
        }
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
    const b64 = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
    if (!b64) throw new Error('音声データが返ってきませんでした。テキストや話し方の指示を変えて再度お試しください。');

    pcm = b64ToInt16(b64);
    buildOutput();
    setStatus('生成できました。再生して確認し、「ダウンロード」を押してください。');
    $('dl').style.display = 'inline-block';
  } catch (e) {
    setStatus('エラー: ' + e.message, true);
  } finally {
    $('go').disabled = false;
  }
}

function buildOutput() {
  const fmt = $('format').value;
  const blob = fmt === 'mp3' ? toMp3(pcm) : toWav(pcm);
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(blob);
  fileName = `speech_${Date.now()}.${fmt}`;
  const p = $('player');
  p.src = blobUrl;
  p.style.display = 'block';
}

function download() {
  if (!pcm) return;
  try { buildOutput(); } catch (e) { return setStatus('エラー: ' + e.message, true); } // 形式を変えた場合に対応
  const a = document.createElement('a');
  a.href = blobUrl;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
</script>
</body>
</html>
