<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テキスト読み上げ＆音声ダウンロード（APIなし）</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 30px auto; padding: 20px; line-height: 1.6; }
  label { display: block; font-weight: bold; margin: 14px 0 4px; }
  textarea, select { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; }
  textarea { height: 140px; }
  input[type=range] { width: 100%; }
  button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 10px 8px 0 0; }
  #status { margin-top: 14px; min-height: 1.5em; }
  .err { color: #c00; }
  .note { font-size: 13px; color: #666; }
  .box { background: #f5f5f5; border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  audio { width: 100%; margin-top: 14px; }
  #dl { display: none; }
</style>
</head>
<body>
<h2>テキスト読み上げ＆ダウンロード</h2>
<div class="box">
  <b>使い方</b>
  <ol>
    <li>テキストを入力して「録音しながら読み上げ」を押します。</li>
    <li>共有の確認画面が出たら、<b>「このタブ」を選び、「タブの音声も共有」にチェック</b>して共有します。</li>
    <li>読み上げが終わると自動で録音が止まり、ダウンロードできます。</li>
  </ol>
  <span class="note">PC版のChrome / Edgeで使えます。読み上げと同じ長さの時間がかかります。録音中は、他の音を鳴らさないでください。</span>
</div>

<label for="textInput">読み上げるテキスト</label>
<textarea id="textInput">こんにちは！テキストを音声に変換して、ダウンロードできるページです。</textarea>

<label for="voice">声</label>
<select id="voice"></select>

<label for="rate">速さ：<span id="rateV">1.0</span></label>
<input id="rate" type="range" min="0.5" max="2" step="0.1" value="1">

<label for="pitch">高さ：<span id="pitchV">1.0</span></label>
<input id="pitch" type="range" min="0" max="2" step="0.1" value="1">

<label for="format">保存形式</label>
<select id="format">
  <option value="wav">WAV</option>
  <option value="mp3">MP3</option>
</select>

<button id="go" onclick="recordSpeech()">録音しながら読み上げ</button>
<button onclick="speechSynthesis.cancel()">読み上げを止める</button>
<button id="dl" onclick="download()">ダウンロード</button>

<div id="status"></div>
<audio id="player" controls style="display:none"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let samples = null, sampleRate = 48000, blobUrl = null, fileName = '';

function setStatus(msg, isErr) { $('status').textContent = msg; $('status').className = isErr ? 'err' : ''; }

// 声の一覧
function loadVoices() {
  const vs = speechSynthesis.getVoices();
  const ja = vs.filter(v => v.lang.toLowerCase().startsWith('ja'));
  const list = ja.length ? ja : vs;
  const cur = $('voice').value;
  $('voice').innerHTML = list.map(v => `<option value="${v.name}">${v.name}（${v.lang}）</option>`).join('');
  if (cur) $('voice').value = cur;
}
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;
$('rate').oninput = () => $('rateV').textContent = $('rate').value;
$('pitch').oninput = () => $('pitchV').textContent = $('pitch').value;

async function recordSpeech() {
  const text = $('textInput').value.trim();
  if (!text) return setStatus('テキストを入力してください。', true);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia)
    return setStatus('このブラウザは画面（タブ）の音声共有に対応していません。PC版のChromeかEdgeで開いてください。', true);

  $('go').disabled = true;
  $('dl').style.display = 'none';
  speechSynthesis.cancel();
  let stream;
  try {
    setStatus('共有の確認画面で「このタブ」を選び、「タブの音声も共有」にチェックを入れてください。');
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: true, audio: true, preferCurrentTab: true, selfBrowserSurface: 'include'
    });
  } catch (e) {
    $('go').disabled = false;
    return setStatus('共有がキャンセルされました。', true);
  }
  stream.getVideoTracks().forEach(t => t.stop()); // 映像は不要
  const audioTracks = stream.getAudioTracks();
  if (!audioTracks.length) {
    $('go').disabled = false;
    return setStatus('音声が共有されていません。もう一度、「このタブ」を選んで「タブの音声も共有」にチェックを入れてください。', true);
  }

  const rec = new MediaRecorder(new MediaStream(audioTracks));
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const stopped = new Promise(res => rec.onstop = res);
  rec.start();

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = parseFloat($('rate').value);
  u.pitch = parseFloat($('pitch').value);
  const v = speechSynthesis.getVoices().find(x => x.name === $('voice').value);
  if (v) { u.voice = v; u.lang = v.lang; }

  setStatus('録音しながら読み上げ中…');
  const finished = new Promise(res => { u.onend = res; u.onerror = res; });
  setTimeout(() => speechSynthesis.speak(u), 300);
  await finished;
  await new Promise(r => setTimeout(r, 500)); // 末尾が切れないように少し待つ
  rec.stop();
  audioTracks.forEach(t => t.stop());
  await stopped;

  try {
    setStatus('音声を変換中…');
    const buf = await new Blob(chunks, { type: chunks[0]?.type || 'audio/webm' }).arrayBuffer();
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const audio = await ctx.decodeAudioData(buf);
    ctx.close();
    const ch = audio.getChannelData(0);
    // 無音（録音できていない）の確認
    let peak = 0;
    for (let i = 0; i < ch.length; i += 50) peak = Math.max(peak, Math.abs(ch[i]));
    if (peak < 0.005) throw new Error('音声が録音されませんでした。「タブの音声も共有」にチェックが入っているか確認してください。それでも無音の場合は、この声（端末の音声）がタブ録音に対応していない可能性があるので、別の声を選んでみてください。');
    sampleRate = audio.sampleRate;
    samples = new Int16Array(ch.length);
    for (let i = 0; i < ch.length; i++) samples[i] = Math.max(-1, Math.min(1, ch[i])) * 32767;
    buildOutput();
    setStatus('録音できました。再生して確認し、「ダウンロード」を押してください。');
    $('dl').style.display = 'inline-block';
  } catch (e) {
    setStatus('エラー: ' + e.message, true);
  } finally {
    $('go').disabled = false;
  }
}

function toWav(s) {
  const buf = new ArrayBuffer(44 + s.length * 2), v = new DataView(buf);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + s.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, s.length * 2, true);
  new Int16Array(buf, 44).set(s);
  return new Blob([buf], { type: 'audio/wav' });
}

function toMp3(s) {
  if (typeof lamejs === 'undefined') throw new Error('MP3エンコーダを読み込めませんでした。WAVを選んでください。');
  const enc = new lamejs.Mp3Encoder(1, sampleRate, 128), parts = [];
  for (let i = 0; i < s.length; i += 1152) {
    const out = enc.encodeBuffer(s.subarray(i, i + 1152));
    if (out.length) parts.push(new Uint8Array(out));
  }
  const end = enc.flush();
  if (end.length) parts.push(new Uint8Array(end));
  return new Blob(parts, { type: 'audio/mpeg' });
}

function buildOutput() {
  const fmt = $('format').value;
  const blob = fmt === 'mp3' ? toMp3(samples) : toWav(samples);
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(blob);
  fileName = `speech_${Date.now()}.${fmt}`;
  $('player').src = blobUrl;
  $('player').style.display = 'block';
}

function download() {
  if (!samples) return;
  try { buildOutput(); } catch (e) { return setStatus('エラー: ' + e.message, true); }
  const a = document.createElement('a');
  a.href = blobUrl; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
}
</script>
</body>
</html>
